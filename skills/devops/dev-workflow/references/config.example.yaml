# Шаблон tools.dev_workflow для EcosystemConfig.yaml
# Скопировать в свой конфиг; подставить пути ЭТОГО хоста. Секреты — только в ~/.hermes/.env
# Роли ВСЕГДА через codex CLI (Курсор отменён). См. roles ниже.

tools:
  dev_workflow:
    enabled: true
    migration_status: unified_only

    DEV_STATE_ROOT: <DEV_STATE_ROOT>
    TZ_ROOT: <TZ_ROOT>
    PIPELINE_ROOT: <PIPELINE_ROOT>
    SKILL_ROOT: <SKILL_ROOT>
    DIGEST_PATH: <DIGEST_PATH>

    invoke:
      default_backend: codex
      codex_pilot_slugs: []
      backends:
        codex:
          bin: codex
        hermes-internal:
          via: call_llm

    roles:
      architect:
        model: gpt-6-astra
        effort: high
        effort_thick: xhigh
        escalate_model: gpt-6-astra
        escalate_effort: high
      reviewer:
        model: gpt-6-astra
        effort: high
        effort_thick: xhigh
      executor:
        model: gpt-6.1-sol
        effort: medium
        effort_multifile: high
      executor_light:
        model: gpt-6-luna
        effort: high
      compressor:
        model: gpt-6.1-terra
        effort: medium

    notify:
      default_chat_id: "<TELEGRAM_CHAT_ID>"

    errorbus:
      tool_name: dev_workflow
      thread_id: "11112"

    orchestration:
      # W1: kanban-primary + pilot_slugs: []
      # W2-W3: dual-path + список пилотных слагов
      # W4 / голая установка: workflow-only
      mode: kanban-primary
      pilot_slugs: []
      status_banner: КАНБАН-СТАТУС