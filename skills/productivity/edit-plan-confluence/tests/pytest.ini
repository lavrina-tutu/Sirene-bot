[pytest]
markers =
    unit: isolated unit tests without network
    archive_integration: isolated archive/SQL tests without ConfluenceClient
    mpp_fixtures: real binary MPP/JVM tests
    confluence_live: explicit live tests on enumerated test pages only
    live: legacy live marker, classified as confluence_live
    slow: slow JVM test, classified as mpp_fixtures when applicable
testpaths = tests
