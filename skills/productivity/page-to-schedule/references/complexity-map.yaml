# Словарь сложность → длительность (дни). Пустая ячейка → fail-loud (не угадывать).
# Ключи сопоставляются после trim + lower; варианты синонимов перечислены в aliases.

default_days: null   # null = ошибка при пустом label

entries:
  - labels:
      - "менее 1 недели"
      - "меньше 1 недели"
      - "< 1 недели"
    days: 3

  - labels:
      - "1 неделя"
      - "одна неделя"
    days: 5

  - labels:
      - "1-2 недели"
      - "1–2 недели"
      - "1 - 2 недели"
      - "одна-две недели"
    days: 10

  - labels:
      - "1-3 недели"
      - "1–3 недели"
      - "1 - 3 недели"
    days: 15
